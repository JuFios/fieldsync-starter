name: ci

on:
  push:
    branches: [main, solution]
  pull_request:

# A newer push to a pull request supersedes the older run. Pushes to main and solution get a group
# per commit, so every commit there gets its own complete run (a shared group would let a newer
# push cancel an older one that is still waiting).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, formatting, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Typecheck (sync-core, test-kit, server, web, e2e)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  integration:
    name: Integration tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fieldsync
          POSTGRES_PASSWORD: fieldsync
          POSTGRES_DB: fieldsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fieldsync -d fieldsync" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://fieldsync:fieldsync@localhost:5432/fieldsync
      # Fail instead of skipping if the database is not configured.
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration
      # The fixed seed corpus of the deterministic simulation against the real server (budget: 60 s;
      # the step timeout is only a safety net, see the Simulation section of the README).
      - name: Simulation corpus
        run: npm run test:sim
        timeout-minutes: 5

  e2e:
    name: End-to-end tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fieldsync
          POSTGRES_PASSWORD: fieldsync
          POSTGRES_DB: fieldsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fieldsync -d fieldsync" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://fieldsync:fieldsync@localhost:5432/fieldsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker images and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build images, check them and start the stack
        run: scripts/docker-smoke.sh
