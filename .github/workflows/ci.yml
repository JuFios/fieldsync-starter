name: ci

on:
  push:
    branches: [main, solution]
  pull_request:

# A newer push to a pull request supersedes the older run. Pushes to main and solution get a group
# per commit, so every commit there gets its own complete run (a shared group would let a newer
# push cancel an older one that is still waiting).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (GitHub's security hardening guide); the comment
# names the release. Browsers for Playwright are installed on every run rather than cached, as the
# Playwright CI documentation advises (restoring the cache takes as long as the download).

jobs:
  checks:
    name: Lint, formatting, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Typecheck (sync-core, test-kit, server, web, e2e)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  integration:
    name: Integration tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fieldsync
          POSTGRES_PASSWORD: fieldsync
          POSTGRES_DB: fieldsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fieldsync -d fieldsync" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://fieldsync:fieldsync@localhost:5432/fieldsync
      # Fail instead of skipping if the database is not configured.
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration
      # The fixed seed corpus of the deterministic simulation against the real server (budget: 60 s;
      # the step timeout is only a safety net, see the Simulation section of the README).
      - name: Simulation corpus
        run: npm run test:sim
        timeout-minutes: 5

  # The simulation command is a developer tool run on every platform; without Postgres it can still
  # be checked for its help, version, option errors and exit codes (scripts/sim-cli-smoke.sh).
  sim-cli:
    name: Simulation CLI smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Help, version, option errors and exit codes
        run: scripts/sim-cli-smoke.sh

  e2e:
    name: End-to-end tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fieldsync
          POSTGRES_PASSWORD: fieldsync
          POSTGRES_DB: fieldsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fieldsync -d fieldsync" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://fieldsync:fieldsync@localhost:5432/fieldsync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker images and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images, check them and start the stack
        run: scripts/docker-smoke.sh
      # Report only: known vulnerabilities of the kept runtime versions must not turn CI red, and
      # neither may the scanner itself (a vulnerability database download that fails or is rate
      # limited). A failed scan shows as a warning on the step; the report is in the job summary.
      - name: Vulnerability report (Trivy)
        continue-on-error: true
        # A hung database download must end the step, not the whole job (job timeout: 20 min).
        timeout-minutes: 8
        run: |
          {
            echo '## Image vulnerabilities (HIGH, CRITICAL)'
            echo '```'
            scripts/scan-images.sh fieldsync-smoke-server fieldsync-smoke-web
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
